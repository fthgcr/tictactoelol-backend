server.tomcat.accesslog.enabled=true

# No datasource: champion data is a static JSON resource (data/champions.json)
# and game sessions are held in memory by SessionRepository.

# In-memory session TTL (see SessionCleanupService)
# How long a finished match is kept so both clients can still read the final board
game.session.finished-ttl=PT30M
# How long an untouched session is kept (abandoned games, unclaimed matchmaking seats)
game.session.idle-ttl=PT2H
# How often the cleanup job runs, in milliseconds
game.session.cleanup-interval-ms=600000

# WebSocket endpoint
spring.websocket.path=/ws

# WebSocket broker configuration
spring.websocket.messaging.path=/app
spring.websocket.messaging.user-destination-prefix=/user
spring.websocket.messaging.stomp.endpoint=/ws
spring.websocket.messaging.stomp.allowed-origins=*

# Enable/disable debug logging for WebSocket
logging.level.org.springframework.web.socket=DEBUG
