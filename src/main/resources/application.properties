server.tomcat.accesslog.enabled=true

# No datasource: champion data is a static JSON resource (data/champions.json)
# and game sessions are held in memory by SessionRepository.

# WebSocket endpoint
spring.websocket.path=/ws

# WebSocket broker configuration
spring.websocket.messaging.path=/app
spring.websocket.messaging.user-destination-prefix=/user
spring.websocket.messaging.stomp.endpoint=/ws
spring.websocket.messaging.stomp.allowed-origins=*

# Enable/disable debug logging for WebSocket
logging.level.org.springframework.web.socket=DEBUG
